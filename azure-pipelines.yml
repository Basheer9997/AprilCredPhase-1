

pool:
  vmImage: ubuntu-latest

variables:
  acrserviceconnection: 'acr-connection'
  frontendrepository: 'credpay/frontend'
  userrepository: 'credpay/user-service'
  paymentrepository: 'credpay/payment-service'
  tag: '$(Build.BuildId)'

stages:
  - stage: terraform
    displayName: creating terraform infra
    jobs:
      - job: terraformapply
        displayName: terraform init & apply
        steps:
          - checkout: self
          
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 'latest'

          - task: AzureCLI@3
            inputs:
              connectionType: 'azureRM'
              azureSubscription: 'devops-manual'
              scriptType: 'batch'
              scriptLocation: 'inlineScript'
              workingDirectory: terraform
              inlineScript: | 
                terraform init
          
